name: Deploy to GitHub Pages

# GitHub Pages for this project is served from VeigaPunk.github.io/halo/
# (user site). This workflow is kept as a no-op placeholder so the
# standalone repo stays ready if Pages is later enabled on VeigaPunk/halo
# (Settings → Pages → GitHub Actions).

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  note:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Live site: https://veigapunk.github.io/halo/"
          echo "Source static export lives in docs/ and is published via VeigaPunk.github.io"
